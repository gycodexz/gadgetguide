<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GadgetGuide — reset password</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient"><span></span><span></span><span></span></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="assets/logo.png" alt="GadgetGuide" class="mark logo-mark" style="margin-bottom:16px;" />
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-sub" id="subText">Enter a new password for your account.</p>

      <form id="resetForm" class="auth-form">
        <input id="password" type="password" placeholder="New password" required minlength="6" />
        <input id="confirmPassword" type="password" placeholder="Confirm new password" required minlength="6" />
        <div class="auth-error" id="resetError"></div>
        <button type="submit" class="btn primary" style="width:100%; padding:12px;">Reset password</button>
      </form>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const errorEl = document.getElementById("resetError");

  if (!token) {
    document.getElementById("subText").textContent = "This link is missing a reset token — request a new one from the login page.";
    document.getElementById("resetForm").style.display = "none";
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      errorEl.textContent = "Passwords don't match.";
      return;
    }

    const res = await fetch("/api/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      errorEl.textContent = data.error === "invalid_or_expired_token"
        ? "This reset link is invalid or has expired — request a new one from the login page."
        : "Something went wrong. Please try again.";
      return;
    }

    document.querySelector(".auth-card").innerHTML = `
      <img src="assets/logo.png" alt="GadgetGuide" class="mark logo-mark" style="margin-bottom:16px;" />
      <h1 class="auth-title">Password updated</h1>
      <p class="auth-sub">You can now log in with your new password.</p>
      <a href="/login.html" class="btn primary" style="display:block; text-align:center; padding:12px; text-decoration:none;">Go to login</a>
    `;
  });
</script>
</body>
</html>
